
# Build and deploy CareerVault ASP.NET Core API to Azure App Service

name: Build and deploy ASP.Net Core app to Azure Web App - careervault

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # Build only the ASP.NET Core backend project
      - name: Build backend
        run: dotnet build backend/CareerVault.Api/CareerVault.Api.csproj --configuration Release

      # Publish the backend into a deployment folder
      - name: Publish backend
        run: dotnet publish backend/CareerVault.Api/CareerVault.Api.csproj --configuration Release --output "${{ runner.temp }}/careervault-publish"

      # Save the published files for the deployment job
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ runner.temp }}/careervault-publish

  deploy:
    runs-on: windows-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./publish

      # Authenticate using Azure federated identity
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_54741B55C1D646F9B3741F36F3146B70 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1A49A9803243468B98394E0D551934C4 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4077EAD27DE34CA48E65CEA8A91D764D }}

      # Deploy the published backend to Azure App Service
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: careervault
          slot-name: Production
          package: ./publish
